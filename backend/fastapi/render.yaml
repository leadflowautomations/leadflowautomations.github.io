services:
  - type: web
    name: leadflow-api
    runtime: python
    plan: free
    rootDir: backend/fastapi
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: HTTP_TIMEOUT
        value: "12"
      - key: MAX_DISCOVERY_RESULTS
        value: "100"
