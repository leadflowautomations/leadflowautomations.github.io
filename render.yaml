services:
  - type: web
    name: leadflow-api-v3
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/leadflowautomations/leadflowautomations.github.io
    branch: step-7-automate
    autoDeployTrigger: commit
    buildCommand: pip install -r backend/fastapi/requirements.txt
    startCommand: uvicorn backend.fastapi.leadflow_persistent:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leadflow-db
          property: connectionString
      - key: LEADFLOW_DISCOVERY_PROVIDER
        value: photon
      - key: NOMINATIM_MIN_INTERVAL
        value: "1.1"

databases:
  - name: leadflow-db
    plan: free
    region: oregon
    postgresMajorVersion: 18
    diskSizeGB: 1
