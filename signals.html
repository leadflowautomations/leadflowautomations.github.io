<!doctype html><html><body style="background:#070b14;color:white;font-family:Arial;padding:40px"><h1>Lead Flow · Step 3 — Research Signals</h1><p>Research interface is ready for the signal engine.</p><textarea id="source" style="width:100%;height:180px;background:#111;color:white" placeholder="Paste Step 2 prospects JSON"></textarea><button id="run">Research Signals →</button><pre id="out"></pre><script>const API='https://leadflow-assistant-api.leadflowautomations-dav.workers.dev';document.getElementById('run').onclick=async()=>{let p=JSON.parse(document.getElementById('source').value);let r=await fetch(API+'/api/prospect-signals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({industry:'real estate',prospects:Array.isArray(p)?p:p.prospects})});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
