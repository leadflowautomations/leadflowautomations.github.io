<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Lead Flow Step 6 — Business Detail View"><title>Lead Flow · Step 6 — Business Detail</title>
<style>
:root{--bg:#070b14;--panel:#101a2b;--panel2:#0b1422;--line:#26344b;--text:#f5f7fb;--muted:#8e9db2;--blue:#6b93ff;--purple:#896cff;--green:#55d98a;--red:#ff9a9a;--amber:#ffd27a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#182a54,transparent 38%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}.wrap{width:min(1160px,calc(100% - 30px));margin:auto}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;z-index:10;background:#070b14e8;backdrop-filter:blur(16px)}.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:15px}.top a{color:#fff;text-decoration:none}.back{color:#aebbd0!important;font-size:.82rem}.hero{padding:45px 0 25px}.eyebrow{color:#aebfff;font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(2rem,5vw,4rem);line-height:1;letter-spacing:-.055em;margin:12px 0}.hero p{max-width:850px;color:var(--muted)}.identity{display:flex;gap:15px;align-items:center;flex-wrap:wrap}.rank{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#1a2740;color:#c9d6ff;font-weight:900}.scorebox{margin-left:auto;text-align:right}.score{font-size:2rem;font-weight:900}.score small{font-size:.68rem;color:var(--muted);font-weight:600}.tier{display:inline-block;font-size:.62rem;font-weight:850;letter-spacing:.06em;padding:5px 8px;border-radius:99px;border:1px solid #3b527d}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.panel{background:linear-gradient(145deg,#101a2b,#0a111d);border:1px solid var(--line);border-radius:18px;padding:20px}.wide{grid-column:1/-1}.panel h2{font-size:.88rem;margin:0 0 15px}.panel h2 span{color:#75849a;font-size:.65rem;font-weight:600;margin-left:7px}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.fact{padding:12px;border:1px solid var(--line);border-radius:11px;background:#ffffff03}.fact small{display:block;color:#718098;font-size:.6rem;text-transform:uppercase}.fact strong,.fact a{display:block;margin-top:4px;font-size:.77rem;color:#e9effa;word-break:break-word}.fact a{color:#aebfff;text-decoration:none}.signalgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.signal{padding:13px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}.signal strong{display:block;font-size:.76rem}.state{display:inline-block;margin-top:6px;font-size:.62rem;font-weight:800}.yes{color:var(--green)}.no{color:var(--red)}.unknown{color:var(--amber)}.list{display:grid;gap:8px}.item{padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#ffffff03;color:#c4cede;font-size:.72rem;word-break:break-word}.gap{border-color:#654343;color:#ffb7b7}.evidence{color:#c4cede;font-size:.72rem;white-space:pre-wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid #3d5e9e;background:#172744;color:#dbe5ff;border-radius:10px;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff}.empty{padding:45px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:#fff;font-size:1.1rem;margin-bottom:7px}.foot{border-top:1px solid var(--line);margin-top:45px;padding:25px 0;color:#68778e;font-size:.7rem}@media(max-width:800px){.grid,.facts{grid-template-columns:1fr}.wide{grid-column:auto}.signalgrid{grid-template-columns:1fr 1fr}.scorebox{margin-left:0;text-align:left}}@media(max-width:500px){.signalgrid{grid-template-columns:1fr}}
</style></head>
<body>
<header class="top"><div class="wrap"><a href="index.html">↗ Lead Flow Automation</a><a class="back" href="rank.html">← Step 5 · Rank</a></div></header>
<main class="wrap" id="app"></main>
<footer class="foot"><div class="wrap">Lead Flow Automation · Step 6 — Business Detail · Evidence first, action next.</div></footer>
<script>
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const arr=v=>Array.isArray(v)?v:[];
const truth=v=>v===true;
function link(v){if(!v)return 'Not available';try{const u=new URL(v);return `<a href="${esc(u.href)}" target="_blank" rel="noopener noreferrer">${esc(u.href)}</a>`}catch{return esc(v)}}
function state(v){return truth(v)?'<span class="state yes">● Present</span>':'<span class="state no">● Not detected</span>'}
function fact(label,value){return `<div class="fact"><small>${esc(label)}</small><strong>${value||'Not available'}</strong></div>`}
function list(title,items,empty='None recorded'){return `<section class="panel"><h2>${esc(title)}</h2><div class="list">${items.length?items.map(x=>`<div class="item">${esc(x)}</div>`).join(''):`<div class="item">${esc(empty)}</div>`}</div></section>`}
function render(p){
 const x=p.score||{},r=p.research||{},s=p.signals||{},t=s.technology||{},w=s.website||{},c=s.contact||{},b=s.booking||{},rv=s.reviews||{},so=s.social||{},seo=s.seo||{},ranking=p.ranking||{};
 const gaps=arr(x.gaps), strengths=arr(x.strengths), evidence=arr(s.evidence?.length?s.evidence:r.evidence), services=arr(r.services), headings=arr(r.headings), socials=arr(r.socials?.length?r.socials:so.profiles);
 app.innerHTML=`<section class="hero"><div class="eyebrow">Lead Flow · Step 06</div><div class="identity"><span class="rank">#${esc(p.rank||ranking.rank||'?')}</span><div><h1>${esc(p.name||'Unnamed business')}</h1><p>${esc(p.address||w.address||'')} ${p.city?' · '+esc(p.city):''}</p></div><div class="scorebox"><div class="score">${esc(x.score??0)}<small>/100</small></div><span class="tier">${esc(x.priority||ranking.priority||'P4')} · ${esc(x.opportunity||ranking.opportunity||'Low').toUpperCase()}</span></div></div><p>Complete business intelligence view: what Lead Flow discovered, what was verified, what was researched, what signals were found or not detected, and why this business received its Step 4 score and Step 5 rank.</p><div class="actions"><a class="btn" href="rank.html">← Back to ranked opportunities</a><button class="btn primary" id="automate">Automate this business →</button></div></section>
<section class="grid">
 <section class="panel wide"><h2>Business & contact <span>IDENTITY</span></h2><div class="facts">${fact('Business name',esc(p.name||'Unnamed business'))}${fact('Rank',`#${esc(p.rank||ranking.rank||'?')}`)}${fact('Address',esc(p.address||'Not available'))}${fact('Phone',esc((arr(c.phones).join(', ')||p.phone||'Not available')))}${fact('Email',esc((arr(c.emails).join(', ')||p.email||'Not available')))}${fact('Website',link(p.website||w.url||''))}${fact('Website status',esc(w.status||r.status||'Not researched'))}${fact('HTTPS',w.https?'Verified':'Not verified')}</div></section>
 <section class="panel wide"><h2>Research status <span>STEP 3</span></h2><div class="facts">${fact('Research status',esc(r.status||'Unknown'))}${fact('Research timestamp',esc(p.researchedAt||r.timestamp||'Not available'))}${fact('Website title',esc(w.title||r.title||'Not available'))}${fact('Description',esc(r.description||'Not available'))}${fact('Content length',esc(r.contentLength||'0'))}${fact('Research confidence',esc(x.confidence||'Unknown'))}</div></section>
 <section class="panel wide"><h2>Signal map <span>PRESENT / NOT DETECTED</span></h2><div class="signalgrid">
 ${signal('Website',w.reachable??w.present,w.reachable?'Reachable and inspected':w.status||'Not detected')}
 ${signal('Direct contact',c.present,c.summary)}${signal('Booking / appointments',b.present,b.summary)}${signal('Reviews / testimonials',rv.present,rv.summary)}${signal('Social presence',so.present,so.summary)}${signal('Basic SEO',seo.healthy,seo.summary)}${signal('Lead capture form',t.form,'Lead form detected')}${signal('Lead qualification',t.qualification,'Qualification signal detected')}${signal('AI / live chat',t.chat,'Chat signal detected')}${signal('Analytics',t.analytics,'Analytics signal detected')}
 </div></section>
 ${list('Opportunity gaps',gaps.map(g=>`${g.label} — ${g.weight} points — ${g.reason}`),'No material gaps detected.')}
 ${list('Detected strengths',strengths,'No strengths recorded.')}
 ${list('Services detected',services,'No service keywords recorded.')}
 ${list('Social profiles',socials,'No social profile links detected.')}
 ${list('Page headings',headings,'No headings recorded.')}
 <section class="panel wide"><h2>Evidence <span>SOURCE TRACE</span></h2><div class="evidence">${evidence.length?evidence.map(e=>typeof e==='string'?esc(e):esc(JSON.stringify(e))).join('\n\n'):'No evidence records returned.'}</div></section>
 <section class="panel wide"><h2>Scoring & ranking explanation</h2><div class="facts">${fact('Step 4 score',`${esc(x.score??0)}/100`)}${fact('Opportunity',esc(x.opportunity||'Low'))}${fact('Priority',esc(x.priority||'P4'))}${fact('Score rationale',esc(x.rationale||'Not available'))}${fact('Step 5 rank',`#${esc(ranking.rank||p.rank||'?')}`)}${fact('Ranking reason',esc(ranking.rankingReason||'Not available'))}${fact('Actionable gap weight',esc(ranking.actionableGapWeight??0))}${fact('Actionable gap count',esc(ranking.actionableGapCount??gaps.length))}</div></section>
</section>`;
 document.getElementById('automate').onclick=()=>{sessionStorage.setItem('leadflow.automationTarget',JSON.stringify(p));location.href='automate.html'};
}
function signal(label,value,desc){return `<div class="signal"><strong>${esc(label)}</strong>${state(value)}<div style="font-size:.63rem;color:#718098;margin-top:5px">${esc(desc||'')}</div></div>`}
try{const raw=sessionStorage.getItem('leadflow.selectedProspect');if(!raw)throw new Error('No business selected');const p=JSON.parse(raw);if(!p||typeof p!=='object')throw new Error('Invalid business');render(p)}catch(e){app.innerHTML=`<section class="empty"><strong>No business is selected.</strong>Return to Step 5 and tap “View business detail” on a ranked business.</section>`}
</script></body></html>
