name: Validate LeadFlow Step 4

on:
  workflow_dispatch:
  push:
    branches: [step-4-score]
    paths:
      - 'backend/prospect-signals.js'
      - 'backend/prospect-scoring.js'
      - 'backend/cloudflare/src/entry-step4-test.js'
      - 'backend/cloudflare/wrangler.step4-test.jsonc'
      - 'backend/cloudflare/step4-live-validation.mjs'
      - '.github/workflows/validate-step4.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Validate Cloudflare credentials are available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          echo 'Cloudflare GitHub Actions credentials are available.'

      - name: Deploy isolated Step 4 test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.step4-test.jsonc

      - name: Validate isolated Worker health
        working-directory: .
        env:
          TEST_WORKER_URL: https://leadflow-assistant-api-step4-test.leadflowautomations-dav.workers.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            response="$(curl -sS --max-time 10 -w '\n%{http_code}' "$TEST_WORKER_URL/api/step4-health" || true)"
            body="${response%$'\n'*}"
            code="${response##*$'\n'}"
            if [ "$code" = "200" ] && printf '%s' "$body" | grep -q '"ok":true'; then
              echo 'Step 4 isolated Worker health check passed.'
              exit 0
            fi
            echo "Test Worker is not ready/healthy (attempt ${attempt}/12, HTTP ${code}): ${body}"
            sleep 5
          done
          echo 'Step 4 isolated Worker health check failed.'
          exit 1

      - name: Run real Step 3 to Step 4 validation
        working-directory: .
        env:
          TEST_WORKER_URL: https://leadflow-assistant-api-step4-test.leadflowautomations-dav.workers.dev
        run: node backend/cloudflare/step4-live-validation.mjs
