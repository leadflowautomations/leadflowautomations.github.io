name: Connect LeadFlow qualification
on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect qualification script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="leadflow-qualification.js" defer></script>'
          if tag not in s:
              s = s.replace('</head>', f'{tag}</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Connect LeadFlow qualification engine' && git push)
