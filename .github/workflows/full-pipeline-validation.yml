name: Full Lead Flow Pipeline Validation
on:
  push:
    branches: [step-7-automate]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Run live pipeline
        run: |
          set -euo pipefail
          export API='https://leadflow-assistant-api.leadflowautomations-dav.workers.dev'
          node <<'NODE'
          const API=process.env.API;
          async function call(path,opts={}){const r=await fetch(API+path,{...opts,headers:{accept:'application/json','content-type':'application/json'}});const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error(`${path} returned non-JSON HTTP ${r.status}: ${t.slice(0,300)}`)}if(!r.ok||d?.ok!==true)throw Error(`${path} failed HTTP ${r.status}: ${JSON.stringify(d)}`);return d}
          const q={location:'Miami',country:'United States',industry:'Real Estate',limit:5};
          const discovered=await call(`/api/prospect-search?location=${encodeURIComponent(q.location)}&country=${encodeURIComponent(q.country)}&industry=${encodeURIComponent(q.industry)}&limit=${q.limit}`);
          if(!discovered.prospects?.length)throw Error('DISCOVER returned zero prospects');
          console.log(`DISCOVER PASS: ${discovered.prospects.length} businesses`);
          const verified=await call('/api/prospect-verify',{method:'POST',body:JSON.stringify({industry:q.industry,prospects:discovered.prospects})});
          const eligible=verified.prospects.filter(p=>p.verification?.duplicate!==true&&p.verification?.verified!==false);
          if(!eligible.length)throw Error(`VERIFY returned no eligible prospects: ${JSON.stringify(verified.summary)}`);
          console.log(`VERIFY PASS: ${eligible.length}/${verified.prospects.length} eligible; ${JSON.stringify(verified.summary)}`);
          const signals=await call('/api/prospect-signals',{method:'POST',body:JSON.stringify({location:q.location,industry:q.industry,prospects:eligible})});
          if(!signals.prospects?.length)throw Error('RESEARCH returned zero prospects');
          console.log(`RESEARCH PASS: ${signals.prospects.length}; ${JSON.stringify(signals.summary)}`);
          const scored=await call('/api/prospect-score',{method:'POST',body:JSON.stringify({location:q.location,industry:q.industry,prospects:signals.prospects})});
          if(!scored.prospects?.length||!scored.prospects.every(p=>Number.isFinite(Number(p.score?.score))))throw Error('SCORE returned missing scores');
          const bad=scored.prospects.filter(p=>p.research?.status==='inspected'&&p.research?.confidence==='high'&&!p.research?.title&&!p.research?.description&&!(p.research?.headings||[]).length&&!Number(p.research?.contentLength));
          if(bad.length)throw Error(`QUALITY GUARD FAILED: ${bad.length} empty high-confidence records`);
          console.log(`SCORE PASS: ${scored.prospects.map(p=>p.score.score).join(', ')}`);
          const ranked=await call('/api/prospect-rank',{method:'POST',body:JSON.stringify({location:q.location,industry:q.industry,prospects:scored.prospects})});
          if(!ranked.prospects?.length||ranked.prospects.length!==scored.prospects.length)throw Error('RANK output count mismatch');
          for(let i=1;i<ranked.prospects.length;i++)if(Number(ranked.prospects[i-1].score.score)<Number(ranked.prospects[i].score.score))throw Error('RANK ordering failed');
          console.log('RANK PASS: descending score order');
          ranked.prospects.forEach((p,i)=>console.log(`${i+1}. ${p.name} | ${p.score.score}/100 | ${p.score.opportunity} | ${p.score.priority} | gaps: ${(p.score.gaps||[]).slice(0,3).map(g=>g.label).join(', ')}`));
          console.log('FULL LIVE PIPELINE PASSED: DISCOVER -> VERIFY -> RESEARCH -> SCORE -> RANK');
          NODE
