<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Lead Flow — Prospect Intelligence</title><style>body{margin:0;background:#0b0b0d;color:#f4f1eb;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:32px 18px}.brand{font:22px Georgia;letter-spacing:.12em}.ey{color:#c8a979;font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-top:55px}h1{font:48px Georgia;margin:10px 0}.sub,.status{color:#99969e;line-height:1.6;font-size:13px}.panel{margin-top:28px;padding:22px;background:#151519;border:1px solid #2b2b31;border-radius:10px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;color:#99969e;font-size:9px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:7px}input{width:100%;padding:14px;background:#0f0f12;border:1px solid #2b2b31;border-radius:6px;color:#fff;box-sizing:border-box}button{padding:14px 18px;margin-top:16px;background:#c8a979;border:0;color:#111;text-transform:uppercase;letter-spacing:.12em;font-size:9px;font-weight:700;border-radius:2px;cursor:pointer}button:disabled{opacity:.5}.status{margin-top:16px}.results{margin-top:18px;display:grid;gap:8px}.prospect{padding:16px;border:1px solid #2b2b31;background:#111114;border-radius:7px}.top{display:flex;justify-content:space-between;gap:12px}.name{font-size:12px}.score{font:25px Georgia;color:#c8a979}.meta,.detail{color:#99969e;font-size:9px;margin-top:5px;line-height:1.6}.detail{border-top:1px solid #2b2b31;padding-top:10px;margin-top:10px}.empty{padding:30px;text-align:center;color:#68666c;border:1px dashed #2b2b31}@media(max-width:700px){.fields{grid-template-columns:1fr}h1{font-size:44px}}</style></head><body><main class='wrap'><div class='brand'>LEAD FLOW</div><div class='ey'>PROSPECT INTELLIGENCE</div><h1>Find the best targets.</h1><p class='sub'>Live prospect discovery. This version has the research code directly inside the page — no external JavaScript engine is required.</p><section class='panel'><div class='fields'><div class='field'><label>City / area</label><input id='location' value='Miami'></div><div class='field'><label>Country</label><input id='country' value='United States'></div><div class='field'><label>Industry</label><input id='industry' value='Real estate'></div></div><button id='discover' type='button'>Discover & research targets →</button><div class='status' id='status'>Ready. Click the button to start live discovery.</div><div class='results' id='results'><div class='empty'>Your ranked prospects will appear here.</div></div></section></main><script>const $=id=>document.getElementById(id),btn=$('discover'),status=$('status'),results=$('results');const tags={'real estate':['office=estate_agent','office=property_management','shop=estate_agent'],restaurant:['amenity=restaurant'],hotel:['tourism=hotel'],dentist:['amenity=dentist'],dental:['amenity=dentist'],'law firm':['office=lawyer'],accounting:['office=accountant'],fitness:['leisure=fitness_centre'],gym:['leisure=fitness_centre'],beauty:['shop=beauty','shop=hairdresser'],salon:['shop=hairdresser'],'car dealer':['shop=car'],pharmacy:['amenity=pharmacy'],cafe:['amenity=cafe'],school:['amenity=school'],clinic:['amenity=clinic']};function esc(x){return String(x||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c))}async function json(url,opts={}){const r=await fetch(url,opts);if(!r.ok)throw new Error('Provider returned HTTP '+r.status);return r.json()}async function discover(){const location=$('location').value.trim(),country=$('country').value.trim(),industry=$('industry').value.trim().toLowerCase();if(!location||!country||!industry)throw new Error('Enter a city/area, country and industry first.');status.textContent='1/3 Locating '+location+'…';const geo=await json('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(location+', '+country),{headers:{Accept:'application/json'}});if(!geo.length)throw new Error('Could not locate '+location+', '+country+'.');const lat=Number(geo[0].lat),lon=Number(geo[0].lon);status.textContent='2/3 Searching public business records…';const clauses=(tags[industry]||['office']).map(t=>{const a=t.split('=');return a[1]?'nwr["'+a[0]+'"="'+a[1]+'"](around:30000,'+lat+','+lon+');':'nwr["'+a[0]+'"](around:30000,'+lat+','+lon+');'}).join('');const q='[out:json][timeout:60];('+clauses+');out center tags;';const data=await json('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q),{headers:{Accept:'application/json'}});const seen=new Set(),items=[];(data.elements||[]).forEach(e=>{const t=e.tags||{},name=(t.name||'').trim(),x=e.lat??e.center?.lat,y=e.lon??e.center?.lon;if(!name||x==null||y==null)return;const key=name.toLowerCase()+'|'+Math.round(x*1000)+'|'+Math.round(y*1000);if(seen.has(key))return;seen.add(key);const website=t.website||t['contact:website']||'';let score=50;if(website)score+=25;if(t.phone||t['contact:phone'])score+=10;if(t.email||t['contact:email'])score+=5;if(t['addr:street'])score+=5;items.push({name,website,phone:t.phone||t['contact:phone']||'',location:[t['addr:street'],t['addr:city']].filter(Boolean).join(', ')||country,score:Math.min(100,score),source:'OpenStreetMap'});});items.sort((a,b)=>b.score-a.score);status.textContent='3/3 Complete — '+items.length+' public prospects found.';results.innerHTML='';if(!items.length){results.innerHTML='<div class="empty">No public records were returned. Try a broader area or industry.</div>';return}items.slice(0,100).forEach((p,i)=>{const d=document.createElement('div');d.className='prospect';d.innerHTML='<div class="top"><div><div class="name">#'+(i+1)+' · '+esc(p.name)+'</div><div class="meta">'+esc(p.location)+' · '+esc(p.source)+'</div></div><div class="score">'+p.score+'</div></div><div class="detail">Website: '+(p.website?'<a href="'+esc(p.website)+'" target="_blank" rel="noopener">'+esc(p.website)+'</a>':'Not listed')+'<br>Phone: '+esc(p.phone||'Not listed')+'</div>';results.appendChild(d)})}btn.onclick=async()=>{btn.disabled=true;btn.textContent='Researching…';results.innerHTML='<div class="empty">Starting live discovery…</div>';try{await discover()}catch(e){console.error(e);status.textContent='ERROR: '+(e.message||'Research failed.');results.innerHTML='<div class="empty">The research provider could not be reached. The exact error is shown above.</div>'}finally{btn.disabled=false;btn.textContent='Discover & research targets →'}};</script></body></html>
