<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Lead Flow — Prospect Hunter</title><style>body{margin:0;background:#0b0b0d;color:#f4f1eb;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:30px 18px}.brand{font:22px Georgia;letter-spacing:.12em}.ey{margin-top:50px;color:#c8a979;font-size:10px;letter-spacing:.18em}h1{font:46px Georgia;margin:10px 0}.sub,.status{color:#99969e;font-size:13px;line-height:1.6}.panel{margin-top:25px;padding:20px;background:#151519;border:1px solid #2b2b31;border-radius:12px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{display:block;color:#99969e;font-size:9px;letter-spacing:.13em;margin-bottom:7px}input{width:100%;box-sizing:border-box;padding:15px;background:#0f0f12;border:1px solid #303038;border-radius:7px;color:#fff;font-size:15px}button{margin-top:16px;padding:16px 22px;background:#c8a979;color:#111;border:0;border-radius:3px;font-weight:800;letter-spacing:.1em;cursor:pointer}button:disabled{opacity:.55}.status{margin-top:15px}.count{margin-top:20px;font:28px Georgia;color:#c8a979}.list{display:grid;gap:8px;margin-top:15px}.card{padding:15px;border:1px solid #2b2b31;border-radius:8px;background:#111114}.row{display:flex;justify-content:space-between;gap:15px}.name{font-size:13px}.score{font:25px Georgia;color:#c8a979}.meta{color:#99969e;font-size:9px;margin-top:6px;line-height:1.5}.empty{padding:25px;text-align:center;border:1px dashed #2b2b31;color:#777}@media(max-width:700px){.fields{grid-template-columns:1fr}h1{font-size:40px}}</style></head><body><main class='wrap'><div class='brand'>LEAD FLOW</div><div class='ey'>PROSPECT HUNTER · LIVE TEST</div><h1>Hunt the market.</h1><p class='sub'>Enter a location and industry. Lead Flow will locate the area, query public business records and return named prospects ranked by available public signals.</p><section class='panel'><div class='fields'><div><label>CITY / AREA</label><input id='city' value='Miami'></div><div><label>COUNTRY</label><input id='country' value='United States'></div><div><label>INDUSTRY</label><input id='industry' value='Real estate'></div></div><button id='go' type='button'>START HUNT →</button><div id='status' class='status'>Ready.</div><div id='count' class='count'></div><div id='list' class='list'><div class='empty'>Prospects will appear here.</div></div></section></main><script>const $=x=>document.getElementById(x),go=$('go');const map={'real estate':['office=estate_agent','office=property_management','shop=estate_agent'],'restaurants':['amenity=restaurant'],'restaurant':['amenity=restaurant'],'dentist':['amenity=dentist'],'law':['office=lawyer'],'law firm':['office=lawyer'],'accounting':['office=accountant'],'hotel':['tourism=hotel'],'gym':['leisure=fitness_centre'],'fitness':['leisure=fitness_centre'],'salon':['shop=hairdresser'],'cafe':['amenity=cafe'],'pharmacy':['amenity=pharmacy'],'clinic':['amenity=clinic']};const esc=s=>String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function getJson(u){const r=await fetch(u,{mode:'cors'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function hunt(){const city=$('city').value.trim(),country=$('country').value.trim(),industry=$('industry').value.trim().toLowerCase();if(!city||!country||!industry)throw Error('Please complete all three fields.');$('status').textContent='Locating '+city+'…';const geo=await getJson('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(city+', '+country));if(!geo[0])throw Error('Location not found.');const lat=+geo[0].lat,lon=+geo[0].lon;$('status').textContent='Searching real businesses around '+city+'…';const filters=map[industry]||['office'];const body=filters.map(f=>{const [k,v]=f.split('=');return 'nwr["'+k+'"="'+v+'"](around:30000,'+lat+','+lon+');'}).join('');const query='[out:json][timeout:60];('+body+');out center tags;';const urls=['https://overpass-api.de/api/interpreter?data='+encodeURIComponent(query),'https://overpass.kumi.systems/api/interpreter?data='+encodeURIComponent(query)];let data=null,last=null;for(const u of urls){try{data=await getJson(u);break}catch(e){last=e}}if(!data)throw Error('Business search provider unavailable ('+(last?.message||'network error')+').');const seen=new Set(),items=[];(data.elements||[]).forEach(e=>{const t=e.tags||{},name=(t.name||'').trim();if(!name)return;const lat2=e.lat??e.center?.lat,lon2=e.lon??e.center?.lon,key=name.toLowerCase()+'|'+Math.round(lat2*1000)+'|'+Math.round(lon2*1000);if(seen.has(key))return;seen.add(key);let score=40;if(t.website||t['contact:website'])score+=30;if(t.phone||t['contact:phone'])score+=10;if(t.email||t['contact:email'])score+=10;if(t['addr:street'])score+=5;items.push({name,score:Math.min(score,95),website:t.website||t['contact:website']||'',phone:t.phone||t['contact:phone']||'',address:[t['addr:housenumber'],t['addr:street'],t['addr:city']].filter(Boolean).join(' ')})});items.sort((a,b)=>b.score-a.score);$('status').textContent='Hunt complete.';$('count').textContent=items.length+' prospects discovered';$('list').innerHTML='';if(!items.length){$('list').innerHTML='<div class="empty">No named prospects found. Try a broader industry or area.</div>';return}items.slice(0,100).forEach((p,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML='<div class="row"><div><div class="name">#'+(i+1)+' · '+esc(p.name)+'</div><div class="meta">'+esc(p.address||city)+ (p.phone?' · '+esc(p.phone):'')+'</div></div><div class="score">'+p.score+'</div></div>'+(p.website?'<div class="meta"><a target="_blank" rel="noopener" href="'+esc(p.website)+'">'+esc(p.website)+'</a></div>':'');$('list').appendChild(d)})}go.addEventListener('click',async()=>{go.disabled=true;go.textContent='HUNTING…';$('list').innerHTML='<div class="empty">Searching…</div>';try{await hunt()}catch(e){console.error(e);$('status').textContent='HUNT FAILED: '+e.message;$('count').textContent='';$('list').innerHTML='<div class="empty">The search could not complete. See the status above.</div>'}finally{go.disabled=false;go.textContent='START HUNT →'}});</script></body></html>
