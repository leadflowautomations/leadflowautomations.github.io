<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead Flow · Step 7 — Automate</title><style>:root{--bg:#070b14;--panel:#101a2b;--line:#26344b;--text:#f5f7fb;--muted:#8e9db2;--blue:#6b93ff;--purple:#896cff;--amber:#ffd27a;--red:#ff9a9a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#182a54,transparent 38%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1080px,calc(100% - 30px));margin:auto}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;background:#070b14e8;z-index:5}.top .wrap{display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.back{color:#aebbd0!important;font-size:.82rem}.hero{padding:52px 0 28px}.eyebrow{color:#aebfff;font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(2.4rem,6vw,4.8rem);line-height:.98;letter-spacing:-.06em;margin:13px 0}.hero h1 span{color:#9eb4ff}.hero p{max-width:850px;color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:linear-gradient(145deg,#101a2b,#0a111d);border:1px solid var(--line);border-radius:18px;padding:20px}.wide{grid-column:1/-1}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.fact{padding:12px;border:1px solid var(--line);border-radius:11px;background:#ffffff03}.fact small{display:block;color:#718098;font-size:.6rem;text-transform:uppercase}.fact strong{display:block;margin-top:4px;font-size:.77rem;word-break:break-word}.rec{padding:17px;border:1px solid var(--line);border-radius:14px;margin-top:10px;background:#ffffff03}.rec.primary{border-color:#4567a8;background:#101d33}.rec h3{margin:0;font-size:.9rem}.tag{display:inline-block;font-size:.6rem;padding:4px 7px;border-radius:99px;border:1px solid #3b527d;color:#b9caff;margin-bottom:9px}.problem{color:#ffb7b7;font-size:.72rem;margin:8px 0}.workflow,.value{color:#c4cede;font-size:.73rem;line-height:1.55}.evidence{margin-top:9px;color:#8e9db2;font-size:.66rem}.notice{padding:13px;border:1px solid #765d2e;border-radius:11px;color:#ffd27a;font-size:.7rem;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid #3d5e9e;background:#172744;color:#dbe5ff;border-radius:10px;padding:10px 14px;font-weight:800;text-decoration:none}.empty{padding:50px 20px;text-align:center;color:var(--muted)}.foot{border-top:1px solid var(--line);margin-top:45px;padding:25px 0;color:#68778e;font-size:.7rem}@media(max-width:700px){.grid,.facts{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header class="top"><div class="wrap"><a href="index.html">↗ Lead Flow Automation</a><a class="back" href="detail.html">← Business Detail</a></div></header><main class="wrap" id="app"></main><footer class="foot"><div class="wrap">Lead Flow Automation · Step 7 — Automate · Plan first, deploy only with authorization.</div></footer><script>const app=document.getElementById('app'),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]),arr=v=>Array.isArray(v)?v:[];function fact(k,v){return `<div class="fact"><small>${esc(k)}</small><strong>${esc(v??'Not available')}</strong></div>`}const rules=[['booking','Booking / appointment automation',/booking|appointment/i,'No booking or appointment signal was detected.','Capture booking requests and route qualified visitors into an appointment calendar.','Reduce scheduling friction and turn website interest into booked appointments.'],['form','Lead capture automation',/lead capture|form/i,'No lead capture form was detected.','Add a short lead form that stores enquiries and triggers immediate follow-up.','Capture enquiries instead of relying on visitors to call or email manually.'],['qualification','Lead qualification automation',/qualification/i,'No lead-qualification signal was detected.','Ask qualifying questions, score the enquiry and route high-intent leads to the right person.','Let staff focus on stronger prospects while filtering low-intent enquiries.'],['chat','AI / live chat automation',/AI|chat/i,'No AI/live-chat signal was detected.','Deploy a website assistant for FAQs, service discovery, qualification and lead capture.','Respond immediately and capture intent outside business hours.'],['analytics','Lead tracking & analytics automation',/analytics|measurement/i,'No analytics/measurement signal was detected.','Track enquiry sources, calls, forms or bookings and report conversions in one place.','Make lead generation measurable and improve follow-up decisions.'],['seo','SEO foundation automation',/SEO/i,'Basic SEO signals are incomplete.','Create a repeatable SEO checklist and monitor key pages and metadata.','Improve discoverability and maintain a healthier acquisition foundation.']];function buildPlan(p){const x=p.score||{},g=arr(x.gaps);const recs=rules.filter(r=>g.some(q=>r[2].test(String(q.label)))||({booking:p.signals?.booking?.present,form:p.signals?.technology?.form,qualification:p.signals?.technology?.qualification,chat:p.signals?.technology?.chat,analytics:p.signals?.technology?.analytics,seo:p.signals?.seo?.healthy}[r[0]]===false)).map((r,i)=>{const q=g.find(q=>r[2].test(String(q.label)));return {title:r[1],problem:r[3],workflow:r[4],value:r[5],confidence:x.confidence||'low',evidence:q};});return recs}function render(p){const x=p.score||{},r=p.ranking||{},recs=buildPlan(p);app.innerHTML=`<section class="hero"><div class="eyebrow">Lead Flow · Step 07</div><h1>Turn the gap into<br><span>an automation plan.</span></h1><p>Recommendations are generated from this business's observed Step 3 signals, Step 4 gaps and Step 5 ranking. Nothing is deployed at this stage.</p><div class="actions"><a class="btn" href="detail.html">← Back to business detail</a><a class="btn" href="rank.html">Back to ranking</a></div></section><section class="grid"><section class="panel wide"><h2>Target business</h2><div class="facts">${fact('Business',p.name)}${fact('Rank',`#${p.rank||r.rank||'?'}`)}${fact('Step 4 score',`${x.score??0}/100`)}${fact('Opportunity',x.opportunity)}${fact('Priority',x.priority)}${fact('Evidence confidence',x.confidence)}${fact('Website',p.website||'Not available')}</div></section><section class="panel wide"><h2>Automation recommendations</h2>${recs.length?recs.map((q,i)=>`<article class="rec ${i===0?'primary':''}"><span class="tag">${i===0?'PRIMARY RECOMMENDATION':'NEXT OPPORTUNITY'} · ${esc(q.confidence)} evidence</span><h3>${esc(q.title)}</h3><div class="problem"><strong>Observed gap:</strong> ${esc(q.problem)}</div><div class="workflow"><strong>Proposed workflow:</strong> ${esc(q.workflow)}</div><div class="value"><strong>Business value:</strong> ${esc(q.value)}</div>${q.evidence?`<div class="evidence">Step 4 evidence: ${esc(q.evidence.label)} · ${esc(q.evidence.weight)} points · ${esc(q.evidence.reason)}</div>`:''}</article>`).join(''):`<div class="rec">No recommendation can be confidently prepared from the available evidence. Research more signals before proposing automation.</div>`}</section><section class="panel wide"><div class="notice"><strong>Deployment status: NOT DEPLOYED.</strong><br>This is a prepared automation plan only. No website, CRM, calendar, messaging account or other business system has been connected or changed.</div></section></section>`}try{const raw=sessionStorage.getItem('leadflow.automationTarget');if(!raw)throw Error('No business selected');const p=JSON.parse(raw);if(!p||typeof p!=='object')throw Error('Invalid business');render(p)}catch(e){app.innerHTML='<section class="empty"><strong>No automation target selected.</strong><br>Return to Step 6 and choose “Automate this business”.</section>'}</script></body></html>
