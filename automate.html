<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Lead Flow Step 7 — Automation Plan"><title>Lead Flow · Step 7 — Automate</title><style>:root{--bg:#070b14;--panel:#101a2b;--line:#26344b;--text:#f5f7fb;--muted:#8e9db2;--blue:#6b93ff;--purple:#896cff;--green:#55d98a;--amber:#ffd27a;--red:#ff9a9a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#182a54,transparent 38%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1080px,calc(100% - 30px));margin:auto}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;background:#070b14e8;backdrop-filter:blur(16px);z-index:5}.top .wrap{display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none}.back{color:#aebbd0!important;font-size:.82rem}.hero{padding:52px 0 28px}.eyebrow{color:#aebfff;font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(2.4rem,6vw,4.8rem);line-height:.98;letter-spacing:-.06em;margin:13px 0}.hero h1 span{color:#9eb4ff}.hero p{max-width:850px;color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:linear-gradient(145deg,#101a2b,#0a111d);border:1px solid var(--line);border-radius:18px;padding:20px}.wide{grid-column:1/-1}.panel h2{font-size:.9rem;margin:0 0 14px}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.fact{padding:12px;border:1px solid var(--line);border-radius:11px;background:#ffffff03}.fact small{display:block;color:#718098;font-size:.6rem;text-transform:uppercase}.fact strong{display:block;margin-top:4px;font-size:.77rem;word-break:break-word}.rec{padding:17px;border:1px solid var(--line);border-radius:14px;margin-top:10px;background:#ffffff03}.rec.primary{border-color:#4567a8;background:#101d33}.rec h3{margin:0;font-size:.9rem}.tag{display:inline-block;font-size:.6rem;padding:4px 7px;border-radius:99px;border:1px solid #3b527d;color:#b9caff;margin-bottom:9px}.problem{color:#ffb7b7;font-size:.72rem;margin:8px 0}.workflow,.value{color:#c4cede;font-size:.73rem;line-height:1.55}.evidence{margin-top:9px;color:#8e9db2;font-size:.66rem}.notice{padding:13px;border:1px solid #765d2e;border-radius:11px;color:#ffd27a;font-size:.7rem;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid #3d5e9e;background:#172744;color:#dbe5ff;border-radius:10px;padding:10px 14px;font-weight:800;text-decoration:none}.empty{padding:50px 20px;text-align:center;color:var(--muted)}.foot{border-top:1px solid var(--line);margin-top:45px;padding:25px 0;color:#68778e;font-size:.7rem}@media(max-width:700px){.grid,.facts{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header class="top"><div class="wrap"><a href="index.html">↗ Lead Flow Automation</a><a class="back" href="detail.html">← Business Detail</a></div></header><main class="wrap" id="app"></main><footer class="foot"><div class="wrap">Lead Flow Automation · Step 7 — Automate · Plan first, deploy only with authorization.</div></footer><script>const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const arr=v=>Array.isArray(v)?v:[];function fact(k,v){return `<div class="fact"><small>${esc(k)}</small><strong>${esc(v??'Not available')}</strong></div>`}function render(p){const x=p.score||{},r=p.ranking||{};app.innerHTML=`<section class="hero"><div class="eyebrow">Lead Flow · Step 07</div><h1>Turn the gap into<br><span>an automation plan.</span></h1><p>Lead Flow uses the evidence gathered in Steps 3–6 to prepare automation recommendations for this specific business. This stage proposes what should be built; it does not deploy anything to the business.</p><div class="actions"><a class="btn" href="detail.html">← Back to business detail</a><a class="btn" href="rank.html">Back to ranking</a></div></section><section class="grid"><section class="panel wide"><h2>Target business</h2><div class="facts">${fact('Business',p.name)}${fact('Rank',`#${p.rank||r.rank||'?'}`)}${fact('Step 4 score',`${x.score??0}/100`)}${fact('Opportunity',x.opportunity)}${fact('Priority',x.priority)}${fact('Evidence confidence',x.confidence)}${fact('Website',p.website||p.signals?.website?.url||'Not available')}</div></section><section class="panel wide"><h2>Automation recommendations</h2><div id="recs"></div></section><section class="panel wide"><div class="notice"><strong>Deployment status: NOT DEPLOYED.</strong><br>This plan is based on Lead Flow's observed evidence. No account, website, CRM, calendar, messaging service or other business system has been connected or changed.</div></section></section>`;const plan=window.__plan;document.getElementById('recs').innerHTML=arr(plan.recommendations).length?arr(plan.recommendations).map((q,i)=>`<article class="rec ${i===0?'primary':''}"><span class="tag">${i===0?'PRIMARY RECOMMENDATION':'NEXT OPPORTUNITY'} · ${esc(q.confidence)} evidence</span><h3>${esc(q.title)}</h3><div class="problem"><strong>Observed gap:</strong> ${esc(q.problem)}</div><div class="workflow"><strong>Proposed workflow:</strong> ${esc(q.workflow)}</div><div class="value"><strong>Business value:</strong> ${esc(q.value)}</div>${q.evidence?`<div class="evidence">Step 4 evidence: ${esc(q.evidence.gap)} · ${esc(q.evidence.weight)} points · ${esc(q.evidence.reason)}</div>`:''}</article>`).join(''):`<div class="rec">No recommendation can be confidently prepared from the available evidence. Research more signals before proposing automation.</div>`}async function load(){const raw=sessionStorage.getItem('leadflow.automationTarget');if(!raw){app.innerHTML='<section class="empty"><strong>No automation target selected.</strong><br>Return to Step 6 and choose “Automate this business”.</section>';return}let p;try{p=JSON.parse(raw)}catch{app.innerHTML='<section class="empty"><strong>Invalid automation target.</strong></section>';return}try{const r=await fetch(`${(window.LEADFLOW_API_BASE||'https://leadflow-assistant-api.leadflowautomations-dav.workers.dev').replace(/\/$/,'')}/api/prospect-automation`,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({prospect:p})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`Automation planning returned HTTP ${r.status}.`);window.__plan=d.plan;render(p)}catch(e){app.innerHTML=`<section class="empty"><strong>Automation planning failed.</strong><br>${esc(e.message||'Unknown error.')}</section>`}}load();</script></body></html>
