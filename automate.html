<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead Flow Step 7 — Automate</title><style>body{margin:0;background:#070b14;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#101a2b;border:1px solid #26344b;border-radius:18px;padding:20px;margin:14px 0}h1{font-size:clamp(2rem,7vw,4rem);line-height:1;margin:15px 0}p{color:#aebbd0;line-height:1.6}.tag{display:inline-block;color:#b9caff;border:1px solid #3b527d;border-radius:99px;padding:5px 8px;font-size:.7rem}.rec{border:1px solid #26344b;border-radius:14px;padding:16px;margin:10px 0}.primary{border-color:#4567a8}.muted{color:#8e9db2;font-size:.8rem}.warn{border-color:#765d2e;color:#ffd27a}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fact{padding:12px;border:1px solid #26344b;border-radius:10px}.fact small{display:block;color:#718098;text-transform:uppercase;font-size:.6rem}.fact strong{display:block;margin-top:5px}@media(max-width:650px){.facts{grid-template-columns:1fr}}</style></head><body><main class="wrap" id="app"><div class="card"><h1>Step 7<br><span>Automate.</span></h1><p>This is the GitHub Pages test entry for Lead Flow Step 7. To generate a business-specific plan, open Step 6 and choose <b>Automate this business</b>.</p></div></main><script>const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>\'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const arr=v=>Array.isArray(v)?v:[];const rules=[['booking','Booking / appointment automation',/booking|appointment/i,'No booking or appointment signal was detected.','Capture booking requests and route qualified visitors into an appointment calendar.','Reduce scheduling friction and turn website interest into booked appointments.'],['form','Lead capture automation',/lead capture|form/i,'No lead capture form was detected.','Add a short lead form that stores enquiries and triggers immediate follow-up.','Capture enquiries instead of relying on visitors to call or email manually.'],['qualification','Lead qualification automation',/qualification/i,'No lead-qualification signal was detected.','Ask qualifying questions, score the enquiry and route high-intent leads to the right person.','Let staff focus on stronger prospects while filtering low-intent enquiries.'],['chat','AI / live chat automation',/AI|chat/i,'No AI/live-chat signal was detected.','Deploy a website assistant for FAQs, service discovery, qualification and lead capture.','Respond immediately and capture intent outside business hours.'],['analytics','Lead tracking & analytics automation',/analytics|measurement/i,'No analytics/measurement signal was detected.','Track enquiry sources, calls, forms or bookings and report conversions in one place.','Make lead generation measurable and improve follow-up decisions.'],['seo','SEO foundation automation',/SEO/i,'Basic SEO signals are incomplete.','Create a repeatable SEO checklist and monitor key pages and metadata.','Improve discoverability and maintain a healthier acquisition foundation.']];function fact(k,v){return '<div class="fact"><small>'+esc(k)+'</small><strong>'+esc(v??'Not available')+'</strong></div>'}function buildPlan(p){const x=p.score||{},g=arr(x.gaps),s=p.signals||{},presence={booking:s.booking?.present,form:s.technology?.form,qualification:s.technology?.qualification,chat:s.technology?.chat,analytics:s.technology?.analytics,seo:s.seo?.healthy};return rules.filter(r=>g.some(q=>r[2].test(String(q.label)))||presence[r[0]]===false).map(r=>{const q=g.find(q=>r[2].test(String(q.label)));return{title:r[1],problem:r[3],workflow:r[4],value:r[5],confidence:x.confidence||'low',evidence:q}})}function render(p){const x=p.score||{},r=p.ranking||{},recs=buildPlan(p);app.innerHTML='<div class="card"><span class="tag">LEAD FLOW · STEP 07</span><h1>Turn the gap into<br>an automation plan.</h1><p>Recommendations are generated from this business’s observed Step 3 signals, Step 4 gaps and Step 5 ranking. Nothing is deployed at this stage.</p></div><div class="card"><h2>Target business</h2><div class="facts">'+fact('Business',p.name)+fact('Rank','#'+(p.rank||r.rank||'?'))+fact('Step 4 score',(x.score??0)+'/100')+fact('Opportunity',x.opportunity)+fact('Priority',x.priority)+fact('Evidence confidence',x.confidence)+fact('Website',p.website||'Not available')+'</div></div><div class="card"><h2>Automation recommendations</h2>'+(recs.length?recs.map((q,i)=>'<article class="rec '+(i===0?'primary':'')+'"><span class="tag">'+(i===0?'PRIMARY RECOMMENDATION':'NEXT OPPORTUNITY')+' · '+esc(q.confidence)+' evidence</span><h3>'+esc(q.title)+'</h3><p><b>Observed gap:</b> '+esc(q.problem)+'</p><p><b>Proposed workflow:</b> '+esc(q.workflow)+'</p><p><b>Business value:</b> '+esc(q.value)+'</p>'+(q.evidence?'<p class="muted">Step 4 evidence: '+esc(q.evidence.label)+' · '+esc(q.evidence.weight)+' points · '+esc(q.evidence.reason)+'</p>':'')+'</article>').join(''):'<div class="rec">No recommendation can be confidently prepared from the available evidence. Research more signals before proposing automation.</div>')+'</div><div class="card warn"><b>Deployment status: NOT DEPLOYED.</b><br>This is a prepared automation plan only. No business system has been connected or changed.</div>'}try{const raw=sessionStorage.getItem('leadflow.automationTarget');if(!raw)throw Error();const p=JSON.parse(raw);if(!p||typeof p!=='object')throw Error();render(p)}catch(e){}</script></body></html>
