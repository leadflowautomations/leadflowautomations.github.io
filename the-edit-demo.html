<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Edit AI Concierge — Private Concept</title><style>.typing{display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;align-items:center!important;justify-content:flex-start!important;gap:5px!important;width:58px!important;min-width:58px!important;height:38px!important;white-space:nowrap!important;overflow:hidden!important}.typing span{display:block!important;position:static!important;float:none!important;flex:0 0 5px!important;width:5px!important;height:5px!important;min-width:5px!important;max-width:5px!important;margin:0!important;padding:0!important;background:#9a9286!important;border-radius:50%!important;animation:dot 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes dot{50%{opacity:.2;transform:translateY(-2px)}}body{font-family:Arial,sans-serif;margin:0;background:#f3efe7;color:#151411}button{padding:10px 14px;border:1px solid #c7bfb2;border-radius:40px;background:transparent}.chat{max-width:650px;margin:80px auto;background:#faf8f3;border:1px solid #4a463f;box-shadow:0 30px 80px #0003}.chathead{padding:24px;border-bottom:1px solid #d6cec0}.messages{height:300px;padding:25px;display:flex;flex-direction:column;gap:12px}.msg{max-width:76%;padding:12px 15px;font-size:12px;line-height:1.6}.bot{background:#eae3d8;border-radius:2px 18px 18px 18px}.user{align-self:flex-end;background:#1d1b17;color:#fff;border-radius:18px 2px 18px 18px}.opts{padding:17px 20px;border-top:1px solid #d6cec0;display:flex;flex-wrap:wrap;gap:8px}</style></head><body><div class="chat"><div class="chathead"><strong>The Edit Concierge</strong></div><div class="messages" id="messages"></div><div class="opts" id="opts"></div></div><script>const m=document.getElementById('messages'),o=document.getElementById('opts');function add(t,c='bot'){const x=document.createElement('div');x.className='msg '+c;x.textContent=t;m.appendChild(x)}function wait(){const x=document.createElement('div');x.className='msg bot typing';x.innerHTML='<span></span><span></span><span></span>';m.appendChild(x);return x}add('Welcome to The Edit. What brings you here today?');['Buy a property','Sell a property','Invest in Miami'].forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{add(v,'user');o.innerHTML='';const t=wait();setTimeout(()=>{t.remove();add('Wonderful. Tell me a little more about what you are looking for.');},700)};o.appendChild(b)});</script></body></html>
